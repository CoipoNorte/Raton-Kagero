<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1512" />
    <meta
      name="description"
      content="Raton: Zombie Cat Trap - juego web 3D retro. Defiende la quesera de una invasion de gatos zombis encadenando trampas de suelo, pared y techo."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230b1512'/%3E%3Crect x='13' y='17' width='38' height='7' fill='%23d8a24a'/%3E%3Cpolygon points='14,20 50,20 56,38 44,54 20,54 8,38' fill='%23cfd8e3'/%3E%3Cpolygon points='20,33 30,33 28,41 22,41' fill='%230b1512'/%3E%3Cpolygon points='34,33 44,33 42,41 36,41' fill='%230b1512'/%3E%3Cpolygon points='23,34 28,34 27,38 24,38' fill='%23c6f96a'/%3E%3Cpolygon points='37,34 42,34 41,38 38,38' fill='%23c6f96a'/%3E%3Cpolygon points='28,44 36,44 32,51' fill='%23ff9ec4'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Chivo:ital,wght@0,400;0,700;0,900;1,700&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <title>Raton vs Zombie Cats 3D</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #0b1512;
        color: #e9f3e6;
        overscroll-behavior: none;
      }
      body {
        font-family: Chivo, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .boot {
        height: 100%;
        display: grid;
        place-items: center;
        gap: 18px;
        grid-auto-flow: row;
        align-content: center;
        justify-items: center;
        background:
          radial-gradient(120% 90% at 50% 0%, rgba(216, 162, 74, 0.22), transparent 60%),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.03) 0 3px, transparent 3px 6px),
          linear-gradient(#12241f, #0b1512 60%, #07100d);
      }
      .boot h1 {
        font-family: Bungee, Impact, sans-serif;
        font-size: clamp(18px, 4.5vw, 34px);
        letter-spacing: 0.04em;
        margin: 0;
        color: #ffcf3f;
        text-shadow: 3px 3px 0 #123, 0 0 22px rgba(255, 207, 63, 0.35);
      }
      .boot p {
        font-family: "Press Start 2P", monospace;
        font-size: clamp(8px, 2.1vw, 11px);
        color: #57e8d5;
        margin: 0;
      }
      .boot-bar {
        width: min(60vw, 260px);
        height: 12px;
        border: 2px solid #d8a24a;
        padding: 2px;
      }
      .boot-bar i {
        display: block;
        height: 100%;
        width: 40%;
        background: repeating-linear-gradient(90deg, #ffcf3f 0 6px, #a8e63c 6px 12px);
        animation: boot-slide 1.1s steps(6) infinite;
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(240%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <h1>RATON: ZOMBIE CAT TRAP</h1>
        <p>Cargando polígonos PS1...</p>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
